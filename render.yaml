databases:
  - name: equipment-monitoring-db
    plan: free
    databaseName: equipment_monitoring
    user: equipment_monitoring

services:
  - type: web
    name: equipment-monitoring-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      # Locked to the deployed frontend. Falling back to unset/"*" is only
      # for local dev — the server logs a warning if this isn't set.
      - key: ALLOWED_ORIGINS
        value: https://browser-two-teal.vercel.app
      - key: DATABASE_URL
        fromDatabase:
          name: equipment-monitoring-db
          property: connectionString
      # Optional Telegram alert notifications — set both in the Render
      # dashboard (sync: false keeps the values out of the repo).
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
