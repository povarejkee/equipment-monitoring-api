services:
  - type: web
    name: equipment-monitoring-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    # ALLOWED_ORIGINS defaults to "*" (safe here — auth uses bearer tokens,
    # not cookies). Set it in the Render dashboard to lock CORS to the
    # frontend origin once the Vercel URL is known.
